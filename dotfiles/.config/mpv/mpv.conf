# mpv on the X1 Nano (pkgsrc build with native Wayland, nanobsd userland/mpv).
# Zero-copy VA-API: libva is built with its Wayland backend (userland/libva),
# so mpv gets a VA display in the Wayland window and imports the decoded
# NV12 surfaces as dmabufs (1440p60 VP9: ~8 % of one core; vaapi-copy, which
# copies every frame back through the CPU, needed ~26 %).
hwdec=vaapi
vo=gpu-next
