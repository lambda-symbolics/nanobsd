# mpv on the X1 Nano (pkgsrc build with native Wayland, nanobsd userland/mpv).
# This libva has no Wayland support, so zero-copy vaapi cannot get a VA
# display inside a Wayland window; vaapi-copy decodes on the GPU and copies
# each frame back (1440p60 VP9: ~26 % of one core instead of software decode).
hwdec=vaapi-copy
vo=gpu-next
