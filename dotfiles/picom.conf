# XRender uses Xorg's hardware glamor acceleration and synchronized Present.
# GLX/EGL on this installation lack buffer-age support for partial repaints.
backend = "xrender";
vsync = true;
use-damage = true;

# Keep VSync coverage for fullscreen clients as well as the scrolling desktop.
unredir-if-possible = false;

# No decorative effects or opacity changes.
shadow = false;
fading = false;
blur-method = "none";
corner-radius = 0;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.0;
