# Xorg on the i915 KMS driver (modesetting DDX, glamor via Mesa iris).
# Fallback config for the framebuffer driver: /etc/X11/xorg.conf.wsfb
Section "ServerFlags"
	Option "AutoAddDevices" "off"
	Option "DontVTSwitch"   "off"
EndSection

Section "Device"
	Identifier "gpu"
	Driver     "modesetting"
	Option     "kmsdev"      "/dev/dri/card0"
	Option     "AccelMethod" "glamor"
	Option     "PageFlip"    "on"
EndSection

Section "Monitor"
	Identifier "panel"
EndSection

Section "Screen"
	Identifier "screen0"
	Device     "gpu"
	Monitor    "panel"
	DefaultDepth 24
EndSection

Section "InputDevice"
	Identifier "keyboard"
	Driver     "kbd"
	Option     "Protocol" "wskbd"
	Option     "Device"   "/dev/wskbd"
	Option     "XkbLayout" "cz,us"
	Option     "XkbOptions" "grp:alt_shift_toggle"
EndSection

Section "InputDevice"
	Identifier "mouse"
	Driver     "ws"
	Option     "Device"   "/dev/wsmouse"
	Option     "ZAxisMapping" "4 5 6 7"
EndSection

Section "ServerLayout"
	Identifier  "layout"
	Screen      "screen0"
	InputDevice "keyboard" "CoreKeyboard"
	InputDevice "mouse"    "CorePointer"
EndSection
