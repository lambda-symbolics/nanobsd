
# Wayland Firefox/GTK for the Mahogany session (2026-09-26)
PKG_OPTIONS.gtk3+=	wayland
MAKE_JOBS=	6

# mpv for the Mahogany session (2026-10-07): native Wayland via a local
# multimedia/mpv change, no Blu-ray/sixel/JavaScript/SDL2/VDPAU
PKG_OPTIONS.mpv=	-bluray -sixel -javascript -sdl2 -vdpau sndio

# FreeRDP for RDP from the Mahogany session (2026-11-05): the Wayland client
# (wlfreerdp) only, no X11 client, no smartcard (pcsc-lite) support
PKG_OPTIONS.freerdp2=	wayland -x11 -pcsc
