#!/sbin/sysctl -f
#
# $NetBSD: sysctl.conf,v 1.8 2011/09/25 21:47:22 christos Exp $
#
# sysctl(8) variables to set at boot time.

# Default on panic: dump core and reboot. See savecore(8) for information.
# Switch this to 1 if you want to enter the kernel debugger on crashes
# instead. See ddb(4) for an introduction and also try the "help" command
# at the db> prompt.
# If you understand the implication and want to change the behaviour before
# /etc/rc.d/sysctl is run, use the kernel option DDB_ONPANIC, see options(4).
ddb.onpanic?=0

# Default core name template:
#kern.defcorename=%n.core

# Number of kernel threads to use for NFS client
#vfs.nfs.iothreads=4

# Default tty/pty character queue sizes. Should be bumped to 32K or so if
# used in networking (ppp/pppoe)
# tty queues: at the default 1024 a full-screen TUI frame reaches the terminal in 1 KiB
# pieces (measured: 20 KB = 20 reads) and Alacritty can draw a half frame (autolith
# full-TUI flicker, 2026-10-13); 65536 delivers it in three.
kern.tty.qsize=65536
# battery: bias HWP toward energy savings (0=perf,255=save)
machdep.hwp.epp=192
machdep.cidle.tickless=1
# kernel 177: the TSC shifted to a 16 s half wrap, so the tickless CPU 0 is not
# woken every second for the timecounter windup (2026-10-17: cpu0 timer
# interrupts 3.40/2.10 -> 2.61/0.66 per s, clock exact).  176 has no TSC-low:
# this line then just fails and TSC stays.
kern.timecounter.hardware=TSC-low
# kernel 180: driver-managed TGL SAGV/QGV (memory clock follows the display's
# bandwidth need).  2026-10-17, video looping on battery: mode 1 6.5 W vs memory
# pinned at the top point (mode 2) 7.3 W; no underruns, 60/30 Hz switch
# seamless.  Never go back to 0 without a reboot: leaving 1/2 pins the top point.
# Kernels without SAGV support do not have this node: the line then just fails.
hw.drm2.i915_modparams.lispbsd_sagv=1
kern.heartbeat.max_period=15
# wpa_supplicant answers each control command with one AF_LOCAL datagram,
# and a datagram may not exceed the sender's buffer (2048 by default):
# with a few dozen access points in range `wpa_cli scan_results` got no
# reply at all and timed out after 10 s.  Takes effect for sockets created
# afterwards, so for wpa_supplicant at its next start.
net.local.dgram.sendspace=65536
# i915 is built with DRM_I915_DEBUG_MMIO, which checks for unclaimed MMIO
# around every register access.  Only useful when chasing a driver bug.
hw.drm2.i915_modparams.mmio_debug=0
# Kernel 130 (docs/power-levers.org):
# Idle CPUs that still hold a process's pmap are marked to flush when they
# wake instead of being interrupted for each TLB shootdown.
machdep.tlb_lazyskip=1
# The iwx firmware drops beacons that carry nothing new (16 -> 1 interrupt/s).
hw.iwx.beacon_filter=1
# s2idle leaves Wi-Fi associated: resume needs no rescan, and it is the only
# configuration in which the platform has reached SLP_S0 (S0ix) here.
hw.acpi.sleep.freeze_keep_net=1
# The explicit 30 Hz mode sizes the plane watermarks and line time for the
# 30 Hz pixel clock (kernel 142): still a fastset, 2.3 W less package on battery.
hw.drm2.i915_modparams.lispbsd_seamless_rr=3
# gefs root (2026-10-18): suspend only if every file system was quiesced and flushed (docs/s2idle-fs-barrier.org)
hw.acpi.sleep.freeze_fsbarrier=2
# Kernel 198: 802.11n (HT40, Rx reordering, firmware-negotiated Tx A-MPDU,
# dynamic SM power save under powersave).  2026-10-22 on the Zyxel, LAN:
# download 13 -> 100-112 Mbit/s, upload 12.6 -> 100 (docs/wifi-11n.org).
# hw.iwx.ht=0 and `wpa_cli reassociate` goes back to legacy 11a/g.
hw.iwx.ht=1
